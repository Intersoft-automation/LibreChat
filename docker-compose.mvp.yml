services:
  api:
    image: registry.librechat.ai/danny-avila/librechat:v0.8.7
    ports: !reset []
    depends_on: !override
      mongodb:
        condition: service_started
    environment:
      CONFIG_PATH: /app/librechat.yaml
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      RAG_API_URL: ""
      TRUST_PROXY: "1"
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},mcp-gateway
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},mcp-gateway
    volumes:
      - type: bind
        source: ./librechat.mvp.yaml
        target: /app/librechat.yaml
        read_only: true
    networks:
      - default
      - llm-gateway
      - mcp-clients
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:3080/
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 30s

  rag_api:
    profiles:
      - rag

  vectordb:
    profiles:
      - rag

  admin-panel:
    ports: !reset []

  nginx:
    image: nginx:1.29.5-alpine
    depends_on:
      api:
        condition: service_healthy
      admin-panel:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-3080}:80"
      - "127.0.0.1:${ADMIN_PANEL_PORT:-3090}:81"
    volumes:
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/ >/dev/null && wget -qO- http://127.0.0.1:81/ >/dev/null
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 20s
    restart: unless-stopped

networks:
  llm-gateway:
    external: true
    name: llm-gateway
  mcp-clients:
    external: true
    name: mcp-clients
